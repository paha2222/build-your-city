<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Build Your City — Tropical Island</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;background:#087db6;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap 
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
}
body{
  min-height:100vh;
  min-height:100dvh;
  padding:0;
  background:#087db6;
  font-family:system-ui,-apple-system,Segoe UI,sans-serif;
  color:white;
}
.wrap{
  width:100%;
  max-width:none;
  height:100vh;
  height:100dvh;
  height:var(--tg-viewport-height,100dvh);
  margin:0;
  position:relative;
  line-height:0;
  overflow:hidden;
  box-shadow:none;
}
#scene{
  display:block;
  width:100%;
  height:100%;
  object-fit:fill;
  user-select:none;
  -webkit-user-drag:none;
}
#scene{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;padding:0;line-height:normal}
.hotspot:focus-visible{outline:3px solid #fff500;outline-offset:-3px}
#build-house{left:2.6%;top:85.5%;width:12%;height:14%}
#build-shop{left:15%;top:85.5%;width:12%;height:14%}
#build-farm{left:27.4%;top:85.5%;width:12%;height:14%}
#build-port{left:39.8%;top:85.5%;width:12%;height:14%}
#build-park{left:52.2%;top:85.5%;width:12%;height:14%}
#build-factory{left:64.6%;top:85.5%;width:12%;height:14%}
#unlock{left:80.5%;top:58.5%;width:18%;height:19%}
#island-click{left:17%;top:17%;width:66%;height:59%;clip-path:polygon(50% 0,100% 52%,50% 100%,0 52%);cursor:crosshair}
#placed{position:absolute;inset:0;pointer-events:none}
.placed{position:absolute;transform:translate(-50%,-70%);font-size:clamp(16px,3.4vw,43px);filter:drop-shadow(0 3px 2px #235a27);line-height:1}
#toast{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);background:#06385eeF;border:1px solid #8edfff;border-radius:14px;padding:12px 18px;font-size:14px;line-height:1.3;box-shadow:0 8px 28px #00334c55;max-width:90%;text-align:center;display:none}
#status{position:absolute;left:2%;top:2%;width:20%;height:12%;pointer-events:none}
@media(max-width:600px){.wrap{width:100%}.placed{font-size:20px}#toast{font-size:12px;bottom:8px;padding:9px 12px}}
</style>
</head>
<body>
<div class="wrap" id="wrap">
<img id="scene" alt="Build Your City — тропический остров с изометрической сеткой, морем и меню строительства">
<div id="placed"></div>
<button class="hotspot" id="island-click" aria-label="Поставить выбранное здание на свободную клетку острова" title="Нажми на остров, чтобы разместить здание"></button>
<button class="hotspot" id="build-house" aria-label="Выбрать дом" title="Дом — 100 монет"></button>
<button class="hotspot" id="build-shop" aria-label="Выбрать магазин" title="Магазин — 150 монет"></button>
<button class="hotspot" id="build-farm" aria-label="Выбрать ферму" title="Ферма — 200 монет"></button>
<button class="hotspot" id="build-port" aria-label="Выбрать порт" title="Порт — 300 монет"></button>
<button class="hotspot" id="build-park" aria-label="Выбрать парк" title="Парк — 250 монет"></button>
<button class="hotspot" id="build-factory" aria-label="Выбрать завод" title="Завод — 500 монет"></button>
<button class="hotspot" id="unlock" aria-label="Открыть следующий остров" title="Следующий остров: 10 000 монет и уровень 5"></button>
</div>
<div id="toast" role="status"></div>
<script>
/* Telegram Mini App bootstrap: runs in Telegram, degrades gracefully in a normal browser. */
(function(){
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) {
    tg.ready();
    tg.expand();
    try { tg.setHeaderColor('#087db6'); tg.setBackgroundColor('#087db6'); } catch(e) {}
    document.documentElement.style.setProperty('--tg-viewport-height', (tg.viewportStableHeight || tg.viewportHeight || window.innerHeight) + 'px');
    window.addEventListener('resize', () => document.documentElement.style.setProperty('--tg-viewport-height', (tg.viewportStableHeight || tg.viewportHeight || window.innerHeight) + 'px'));
  }
})();
const imageData='island_scene.png';
document.getElementById('scene').src=imageData;
const catalog={
 'build-house':{name:'Дом',emoji:'🏠',cost:100,income:10,xp:20},
 'build-shop':{name:'Магазин',emoji:'🏪',cost:150,income:18,xp:25},
 'build-farm':{name:'Ферма',emoji:'🌾',cost:200,income:24,xp:30},
 'build-port':{name:'Порт',emoji:'⚓',cost:300,income:15,xp:35},
 'build-park':{name:'Парк',emoji:'🌳',cost:250,income:5,xp:25},
 'build-factory':{name:'Завод',emoji:'🏭',cost:500,income:45,xp:50}
};
let selected=null,coins=500,xp=0,level=1,buildings=[],income=0;
const toast=document.getElementById('toast');
function say(msg){toast.textContent=msg;toast.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.style.display='none',2600)}
function select(id){const b=catalog[id];if(coins<b.cost){say('Не хватает монет на '+b.name+'!');return}selected=b;say('Выбрано: '+b.name+'. Нажми на свободную клетку острова.')}
Object.keys(catalog).forEach(id=>document.getElementById(id).addEventListener('click',()=>select(id)));
document.getElementById('island-click').addEventListener('click',e=>{
 if(!selected){say('Сначала выбери здание в нижнем меню.');return}
 if(coins<selected.cost){say('Не хватает монет!');return}
 const rect=document.getElementById('wrap').getBoundingClientRect();
 const x=(e.clientX-rect.left)/rect.width*100,y=(e.clientY-rect.top)/rect.height*100;
 // Keep placements within the diamond-shaped buildable area.
 if(y<20||y>78||x<18||x>82){say('Выбери клетку внутри зелёной строительной зоны.');return}
 if(buildings.some(b=>Math.hypot(b.x-x,b.y-y)<3.1)){say('Это место занято. Выбери другую клетку.');return}
 coins-=selected.cost;income+=selected.income;xp+=selected.xp;
 while(xp>=100){xp-=100;level++}
 buildings.push({x,y,...selected});
 const layer=document.getElementById('placed');
 const el=document.createElement('div');el.className='placed';el.textContent=selected.emoji;
 el.style.left=x+'%';el.style.top=y+'%';el.title=selected.name;layer.appendChild(el);
 say(selected.name+' построен! Доход поселения: +'+income+' монет за сбор. Осталось монет: '+coins+'. Уровень '+level+'.');
 selected=null;
});
document.getElementById('unlock').addEventListener('click',()=>{
 if(level<5||coins<10000){say('Следующий остров откроется на 5 уровне за 10 000 монет. Сейчас: уровень '+level+', '+coins+' монет.');return}
 coins-=10000;say('Остров открыт! Следующий этап — отдельная карта архипелага.');
});
</script>
</body>
</html>
